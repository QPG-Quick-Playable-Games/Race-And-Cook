<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apex Racer 3D - Ultimate Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030712; color: #fff; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* UI Layer */
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
    .interactive { pointer-events: auto; }
    
    /* HUD */
    #hud { display: none; justify-content: space-between; padding: 15px; width: 100%; }
    .hud-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px 18px; border-radius: 12px; }
    .speedo { font-size: 1.6rem; font-weight: 900; font-style: italic; color: #38bdf8; }
    .hud-value { font-size: 1.2rem; font-weight: 700; color: #f8fafc; }
    .hud-label { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

    /* Touch Controls */
    #touch-controls { display: none; width: 100%; padding: 20px; justify-content: space-between; align-items: flex-end; }
    .touch-cluster { display: flex; gap: 12px; }
    .touch-btn { width: 65px; height: 65px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); border: 2px solid rgba(255, 255, 255, 0.3); color: white; font-size: 1.5rem; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    .touch-btn-gas { background: rgba(34, 197, 94, 0.3); border-color: rgba(34, 197, 94, 0.6); }
    .touch-btn-brake { background: rgba(239, 68, 68, 0.3); border-color: rgba(239, 68, 68, 0.6); }

    /* Menus */
    .menu-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 30px; border-radius: 24px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); }
    h1 { font-size: 2.2rem; font-weight: 900; font-style: italic; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; }
    
    .btn { background: linear-gradient(135deg, #0284c7, #2563eb); border: none; color: white; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; margin: 6px 0; width: 100%; font-size: 0.95rem; }
    .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); }
    
    input { width: 100%; padding: 12px; margin: 8px 0 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; text-align: center; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; }
    
    /* Room Code Box */
    .room-display { background: rgba(56, 189, 248, 0.15); border: 1px dashed #38bdf8; padding: 10px; border-radius: 10px; font-size: 1.4rem; font-weight: bold; color: #38bdf8; letter-spacing: 3px; margin: 10px 0; }

    /* Shop Overlay */
    #shop-panel { display: none; max-width: 600px; }
    .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 15px 0; max-height: 50vh; overflow-y: auto; }
    .car-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; text-align: center; }
    .car-card.selected { border-color: #38bdf8; background: rgba(56, 189, 248, 0.15); }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-layer">
    <div id="hud">
      <div class="hud-card">
        <div class="hud-label">Speed</div>
        <div class="speedo"><span id="speed-val">0</span> <span style="font-size: 0.8rem;">KM/H</span></div>
      </div>
      <div class="hud-card" style="text-align: right;">
        <div class="hud-label">Multiplayer</div>
        <div class="hud-value" id="player-count">Solo</div>
      </div>
    </div>

    <div id="touch-controls" class="interactive">
      <div class="touch-cluster">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
      </div>
      <div class="touch-cluster">
        <div class="touch-btn touch-btn-brake" id="btn-brake">S</div>
        <div class="touch-btn touch-btn-gas" id="btn-gas">W</div>
      </div>
    </div>

    <div id="main-menu" class="menu-panel interactive">
      <h1>APEX RACER</h1>
      <button class="btn" onclick="showLobby()">Play Multiplayer</button>
      <button class="btn btn-secondary" onclick="startRace()">Solo Practice</button>
      <button class="btn btn-secondary" onclick="openShop()">Garage & Shop</button>
      <div style="margin-top: 12px; color: #38bdf8; font-weight: bold; font-size: 0.9rem;">Cash: $<span id="menu-cash">0</span></div>
    </div>

    <div id="lobby-menu" class="menu-panel interactive" style="display:none;">
      <h2>Multiplayer</h2>
      
      <p style="font-size:0.8rem; color:#94a3b8; margin-top:10px;">Your Room Code:</p>
      <div class="room-display" id="my-room-code">CREATE...</div>

      <p style="font-size:0.8rem; color:#94a3b8; margin-top:15px;">Or Join a Friend:</p>
      <input type="text" id="join-code-input" placeholder="4-LETTER CODE" maxlength="4">
      <button class="btn" onclick="joinRoom()">Join Room</button>
      
      <button class="btn btn-secondary" style="margin-top: 10px;" onclick="showMainMenu()">Back</button>
    </div>

    <div id="shop-panel" class="menu-panel interactive">
      <h2>Garage</h2>
      <div style="color: #38bdf8; font-weight: bold; margin: 5px 0;">Cash: $<span id="shop-cash">0</span></div>
      <div class="shop-grid" id="shop-grid"></div>
      <button class="btn btn-secondary" onclick="showMainMenu()">Back</button>
    </div>
  </div>

  <script>
    const CARS = [
      { id: 'rookie', name: 'Rookie GT', price: 0, color: 0xef4444, topSpeed: 0.7, accel: 0.015, handling: 0.04 },
      { id: 'phantom', name: 'Phantom V8', price: 1000, color: 0x3b82f6, topSpeed: 0.85, accel: 0.02, handling: 0.045 },
      { id: 'apex', name: 'Apex Hyper', price: 2500, color: 0xeab308, topSpeed: 1.05, accel: 0.025, handling: 0.05 }
    ];

    let gameState = { cash: 1000, ownedCars: ['rookie'], selectedCar: 'rookie' };

    let scene, camera, renderer, composer;
    let playerCarMesh, trackCurve;
    let otherPlayers = {};
    let carState = { x: 0, y: 0.3, z: 0, speed: 0, angle: 0 };
    const keys = { Forward: false, Backward: false, Left: false, Right: false };
    
    // Track Boundary Params
    const TRACK_WIDTH = 6.2;
    let trackSamplePoints = [];

    const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    function initEngine() {
      const container = document.getElementById('canvas-container');

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      container.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030712);
      scene.fog = new THREE.FogExp2(0x030712, 0.012);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

      const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.7);
      scene.add(ambientLight);

      const sun = new THREE.DirectionalLight(0xffedd5, 2.0);
      sun.position.set(100, 120, 50);
      sun.castShadow = true;
      scene.add(sun);

      const renderScene = new THREE.RenderPass(scene, camera);
      const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.4, 0.85);

      composer = new THREE.EffectComposer(renderer);
      composer.addPass(renderScene);
      composer.addPass(bloomPass);

      buildTrackWithBoundaries();
      createPlayerCar();

      window.addEventListener('resize', onWindowResize);
      setupControls();
      animate();
    }

    function buildTrackWithBoundaries() {
      trackCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(80, 0, 60),
        new THREE.Vector3(160, 0, 0),
        new THREE.Vector3(120, 0, -100),
        new THREE.Vector3(0, 0, -120),
        new THREE.Vector3(-80, 0, -60),
        new THREE.Vector3(-50, 0, 30)
      ], true);

      // Pre-calculate 400 dense points along track center for quick distance boundaries
      trackSamplePoints = trackCurve.getPoints(400);

      // Track Mesh
      const trackGeo = new THREE.TubeGeometry(trackCurve, 150, TRACK_WIDTH, 12, true);
      const trackMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.5 });
      const trackMesh = new THREE.Mesh(trackGeo, trackMat);
      trackMesh.scale.set(1, 0.02, 1);
      trackMesh.position.y = -0.1;
      scene.add(trackMesh);

      // Visual Guardrails
      const guardGeo = new THREE.TubeGeometry(trackCurve, 150, TRACK_WIDTH + 0.5, 8, true);
      const guardMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2 });
      const guardMesh = new THREE.Mesh(guardGeo, guardMat);
      guardMesh.scale.set(1, 0.08, 1);
      guardMesh.position.y = 0.1;
      scene.add(guardMesh);

      // Ground Floor
      const groundGeo = new THREE.PlaneGeometry(600, 600);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x060a12, roughness: 0.95 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.2;
      scene.add(ground);
    }

    function createCarMesh(colorHex) {
      const carGroup = new THREE.Group();
      const bodyGeo = new THREE.BoxGeometry(1.7, 0.55, 3.4);
      const bodyMat = new THREE.MeshPhysicalMaterial({ color: colorHex, metalness: 0.7, roughness: 0.15, clearcoat: 1.0 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.45;
      body.castShadow = true;
      carGroup.add(body);

      const cabinGeo = new THREE.BoxGeometry(1.3, 0.45, 1.5);
      const cabinMat = new THREE.MeshPhysicalMaterial({ color: 0x020617, metalness: 0.9, roughness: 0.0 });
      const cabin = new THREE.Mesh(cabinGeo, cabinMat);
      cabin.position.set(0, 0.8, -0.2);
      carGroup.add(cabin);

      return carGroup;
    }

    function createPlayerCar() {
      if (playerCarMesh) scene.remove(playerCarMesh);
      const activeCar = CARS.find(c => c.id === gameState.selectedCar);
      playerCarMesh = createCarMesh(activeCar.color);
      scene.add(playerCarMesh);
    }

    function setupControls() {
      window.addEventListener('keydown', (e) => handleKey(e.code, true));
      window.addEventListener('keyup', (e) => handleKey(e.code, false));

      if (isTouch) {
        document.getElementById('touch-controls').style.display = 'flex';
        const bindTouch = (id, key) => {
          const el = document.getElementById(id);
          el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
          el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        };
        bindTouch('btn-gas', 'Forward');
        bindTouch('btn-brake', 'Backward');
        bindTouch('btn-left', 'Left');
        bindTouch('btn-right', 'Right');
      }
    }

    function handleKey(code, state) {
      if (code === 'KeyW' || code === 'ArrowUp') keys.Forward = state;
      if (code === 'KeyS' || code === 'ArrowDown') keys.Backward = state;
      if (code === 'KeyA' || code === 'ArrowLeft') keys.Left = state;
      if (code === 'KeyD' || code === 'ArrowRight') keys.Right = state;
    }

    function checkTrackBoundary(nextX, nextZ) {
      // Find distance to closest point on track spline
      let minDistanceSq = Infinity;
      const carPos = new THREE.Vector2(nextX, nextZ);

      for (let i = 0; i < trackSamplePoints.length; i++) {
        const pt = trackSamplePoints[i];
        const distSq = carPos.distanceToSquared(new THREE.Vector2(pt.x, pt.z));
        if (distSq < minDistanceSq) minDistanceSq = distSq;
      }

      // Return true if car remains within the allowable road corridor width
      return Math.sqrt(minDistanceSq) <= TRACK_WIDTH - 0.8;
    }

    function updatePhysics() {
      const activeCar = CARS.find(c => c.id === gameState.selectedCar);

      if (keys.Forward) carState.speed = Math.min(carState.speed + activeCar.accel, activeCar.topSpeed);
      else if (keys.Backward) carState.speed = Math.max(carState.speed - activeCar.accel, -activeCar.topSpeed * 0.4);
      else carState.speed *= 0.97;

      if (Math.abs(carState.speed) > 0.01) {
        const dir = carState.speed > 0 ? 1 : -1;
        if (keys.Left) carState.angle += activeCar.handling * dir;
        if (keys.Right) carState.angle -= activeCar.handling * dir;
      }

      const nextX = carState.x + Math.sin(carState.angle) * carState.speed;
      const nextZ = carState.z + Math.cos(carState.angle) * carState.speed;

      // Wall Boundary Check - Stop/Bounce car if leaving track
      if (checkTrackBoundary(nextX, nextZ)) {
        carState.x = nextX;
        carState.z = nextZ;
      } else {
        carState.speed = -carState.speed * 0.3; // Bounce back softly
      }

      if (playerCarMesh) {
        playerCarMesh.position.set(carState.x, carState.y, carState.z);
        playerCarMesh.rotation.y = carState.angle;
      }

      const camOffset = new THREE.Vector3(
        carState.x - Math.sin(carState.angle) * 7.5,
        carState.y + 3.5,
        carState.z - Math.cos(carState.angle) * 7.5
      );
      camera.position.lerp(camOffset, 0.12);
      camera.lookAt(carState.x, carState.y + 0.8, carState.z);

      document.getElementById('speed-val').innerText = Math.floor(Math.abs(carState.speed) * 210);
    }

    // --- SIMPLE MULTIPLAYER SYSTEM (ROOM CODES) ---
    let peer, peerConn;

    function generateShortCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
      return code;
    }

    function initMultiplayer() {
      const myCode = generateShortCode();
      const peerId = 'apex-racer-v1-' + myCode;

      document.getElementById('my-room-code').innerText = myCode;

      peer = new Peer(peerId);

      peer.on('connection', (conn) => {
        peerConn = conn;
        setupConnection();
      });
    }

    function joinRoom() {
      const inputCode = document.getElementById('join-code-input').value.trim().toUpperCase();
      if (inputCode.length !== 4) return alert('Enter a 4-letter room code!');

      const targetPeerId = 'apex-racer-v1-' + inputCode;
      peerConn = peer.connect(targetPeerId);
      setupConnection();
    }

    function setupConnection() {
      peerConn.on('open', () => {
        startRace();
        document.getElementById('player-count').innerText = "2 Players";
      });
      peerConn.on('data', (data) => updateRemotePlayer(data));
    }

    function broadcastState() {
      if (peerConn && peerConn.open) {
        peerConn.send({ id: peer.id, x: carState.x, y: carState.y, z: carState.z, angle: carState.angle, carType: gameState.selectedCar });
      }
    }

    function updateRemotePlayer(data) {
      if (!otherPlayers[data.id]) {
        const carConfig = CARS.find(c => c.id === data.carType) || CARS[0];
        const remoteMesh = createCarMesh(carConfig.color);
        scene.add(remoteMesh);
        otherPlayers[data.id] = remoteMesh;
      }
      otherPlayers[data.id].position.set(data.x, data.y, data.z);
      otherPlayers[data.id].rotation.y = data.angle;
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      broadcastState();
      composer.render();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }

    function updateCashDisplay() {
      document.getElementById('menu-cash').innerText = gameState.cash;
      document.getElementById('shop-cash').innerText = gameState.cash;
    }

    function showMainMenu() {
      document.getElementById('main-menu').style.display = 'block';
      document.getElementById('lobby-menu').style.display = 'none';
      document.getElementById('shop-panel').style.display = 'none';
      updateCashDisplay();
    }

    function showLobby() {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('lobby-menu').style.display = 'block';
      if (!peer) initMultiplayer();
    }

    function openShop() {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('shop-panel').style.display = 'block';
      renderShop();
      updateCashDisplay();
    }

    function renderShop() {
      const grid = document.getElementById('shop-grid');
      grid.innerHTML = '';
      CARS.forEach(car => {
        const isOwned = gameState.ownedCars.includes(car.id);
        const isSelected = gameState.selectedCar === car.id;
        const card = document.createElement('div');
        card.className = `car-card ${isSelected ? 'selected' : ''}`;
        card.innerHTML = `
          <div style="font-weight:bold; font-size: 0.9rem;">${car.name}</div>
          <div style="font-size:0.75rem; color:#94a3b8; margin: 5px 0;">Speed: ${Math.floor(car.topSpeed * 100)}</div>
          ${isOwned 
            ? `<button class="btn btn-secondary" style="font-size:0.75rem; padding:6px;" onclick="selectCar('${car.id}')">${isSelected ? 'Equipped' : 'Select'}</button>`
            : `<button class="btn" style="font-size:0.75rem; padding:6px;" onclick="buyCar('${car.id}')">Buy $${car.price}</button>`
          }
        `;
        grid.appendChild(card);
      });
    }

    function buyCar(carId) {
      const car = CARS.find(c => c.id === carId);
      if (gameState.cash >= car.price) {
        gameState.cash -= car.price;
        gameState.ownedCars.push(car.id);
        gameState.selectedCar = car.id;
        createPlayerCar();
        renderShop();
        updateCashDisplay();
      }
    }

    function selectCar(carId) {
      gameState.selectedCar = carId;
      createPlayerCar();
      renderShop();
    }

    function startRace() {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('lobby-menu').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
    }

    window.onload = () => {
      initEngine();
      updateCashDisplay();
    };
  </script>
</body>
</html>
